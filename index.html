<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
    <style>
        body{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            background-color: bisque;
        }
        header{
            text-align: center;
            color: black;
            background-color: aquamarine;
            border-radius: 12px;
            width: 400px;
            margin: auto;
        

        }
        section{
            background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            width: 600px;
            margin: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        input[type="text"], select, textarea,  input[type="submit"] {
            width: 94%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }
        img{
            display: block;
            margin: auto;
            height: 200px;
            width: 150px;
            padding: 0px;
        }

    </style>



</head>
<body>
    <header
        <h1>
            <strong>MOVIE RATINGS</strong>
        </h1>
        <br
        <p>Rate your movie!</p>
    </header
    <br>

    <section>
        <form action="">
            <img src="https://img.magnific.com/free-vector/cinema-film-production-realistic-transparent-composition-with-isolated-image-clapper-with-empty-fields-vector-illustration_1284-66163.jpg?semt=ais_hybrid&w=740&q=80" alt="movie">
            <br>
            <label for="movie"></label>
            <br>

            <textarea id="Movie title" placeholder="Movie title" rows="2" cols="20"></textarea>
                <p>Click all that apply</p>

            <input type="checkbox" id="genre1 name=genre 
            <label for="genre1">Horror</label>
            <input type="checkbox" id="genre2 name=genre 
            <label for="genre2">Action</label>
            <input type="checkbox" id="genre3 name=genre 
            <label for="genre3">Slice of life</label>
            
            <br>
            <label for="rating"> 
                <strong>rating</strong>
            </label>

            <br>
            <input type="radio" id="rate1" name="rate"
            <label for="rate1">💗</label>
            <input type="radio" id="rate2" name="rate"
            <label for="rate2">💗💗</label>
            <input type="radio" id="rate3" name="rate"
            <label for="rate3">💗💗💗</label>
            <input type="radio" id="rate4" name="rate"
            <label for="rate4">💗💗💗💗</label>
            <input type="radio" id="rate5" name="rate"
            <label for="rate5">💗💗💗💗💗</label>

            <br>
            <textarea id="review" placeholder="Write a review here..." rows="4" cols="40"></textarea>
            <br>

            <input type="submit" id="submit" value="submit review">
            <br>
            
            Click <a href="https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/" target="_blank">here</a> to learn how make a review
            

        </form>


    </section>
         <!--Reference
         Nyfa, & Nyfa. (2024, March 23). How to write a movie review: 10 essential tips. NYFA. https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/
         
         -->

    
</body>
</html>
